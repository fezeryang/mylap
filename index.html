<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TODŌU 个人 3D 设备工作区。" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><rect width=%2216%22 height=%2216%22 rx=%224%22 fill=%22%23f3f4f6%22/><circle cx=%228%22 cy=%228%22 r=%223%22 fill=%22%23285f9f%22/></svg>" />
    <title>TODŌU Workspace</title>
  </head>
  <body>
    <main id="app" aria-label="TODŌU 个人三维设备工作区">
      <canvas id="scene" aria-label="包含电脑、手机和收音机的可交互三维桌面"></canvas>

      <section id="desktop-shell" class="desktop-shell" aria-label="工作区导航">
        <div id="landing-panel" class="visually-hidden">
          <h1 id="desktop-shell-title">TODŌU Workspace</h1>
          <button id="enter-desktop" type="button">进入工作区</button>
        </div>

        <button id="exit-device" class="workspace-back" type="button" hidden>
          <span aria-hidden="true">←</span> 返回
        </button>

        <details class="workspace-menu">
          <summary aria-label="打开工作区菜单">菜单</summary>
          <div class="workspace-menu__panel">
            <nav id="device-focus-controls" class="workspace-menu__devices" aria-label="选择设备">
              <button id="focus-computer" type="button">电脑</button>
              <button id="focus-phone" type="button">手机</button>
              <button id="focus-radio" type="button">收音机</button>
            </nav>
            <div class="workspace-menu__advanced">
              <button id="reset-view" type="button">重置视角</button>
              <button id="auto-rotate" type="button" aria-pressed="false">自动旋转</button>
              <button id="screen-power" type="button" aria-pressed="true">屏幕开关</button>
              <label for="explode-range">
                <span>拆解</span>
                <input id="explode-range" type="range" min="0" max="1" step="0.01" value="0" />
              </label>
            </div>
          </div>
        </details>

        <p id="navigation-status" class="visually-hidden" aria-live="polite">正在进入工作区</p>
        <p id="status-text" class="visually-hidden" aria-live="polite">正在加载设备</p>
        <p id="part-title" class="visually-hidden">当前设备</p>
        <p id="part-meta" class="visually-hidden">设备部件</p>
      </section>

      <button id="close-expanded-screen" class="expanded-screen-close" type="button" hidden>
        关闭窗口
      </button>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
